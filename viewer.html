<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Council of Achrona – de raadszaal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,600;0,700;1,400&family=Alegreya+Sans:wght@400;500;700&family=Pirata+One&display=swap" rel="stylesheet">
<style>
  :root {
    --nacht: #15132a; --gewelf: #221f3d; --gewelf-rand: #3a355f; --steen: #2c2850;
    --perkament: #efe3c6; --perkament-donker: #e2d1a8; --inkt: #2b2118; --inkt-zacht: #6b5a45;
    --licht: #ece6f7; --zacht: #a59fc2; --bladgoud: #e5b04c; --kaars: #ffcf7a; --leylijn: #5fe1d9;
    --ok: #6cd38a; --fout: #ff7a7a; --waarschuwing: #ffb347;
    --archmage: #9a7bff; --engineer: #e08a3c; --guardian_keeper: #5aa2ea; --historian: #c99a5b;
    --oracle: #ee6aa8; --beast_master: #6cc164; --koning: #e5b04c; --mens: #ef6b6b;
    --sierlijk: "Pirata One", "Old English Text MT", Georgia, serif;
    --boek: "Alegreya", "Palatino Linotype", Palatino, Georgia, serif;
    --schrift: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { background: var(--nacht); }
  body {
    margin: 0; color: var(--licht); font: 16px/1.6 var(--boek);
    background:
      radial-gradient(900px 420px at 50% -120px, rgba(229, 176, 76, .20), transparent 70%),
      radial-gradient(700px 500px at 0% 30%, rgba(95, 225, 217, .06), transparent 70%),
      radial-gradient(700px 500px at 100% 60%, rgba(238, 106, 168, .06), transparent 70%),
      var(--nacht);
    min-height: 100vh;
  }
  code { font-family: var(--schrift); font-size: .88em; background: rgba(255, 255, 255, .07); padding: 0 .3em; border-radius: 4px; }

  .kop { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; padding: 14px 24px 6px; max-width: 1480px; margin: 0 auto; }
  .kop .wapen { width: 46px; height: 46px; flex: none; filter: drop-shadow(0 0 10px rgba(229, 176, 76, .45)); }
  .kop h1 { margin: 0; font-weight: 400; line-height: 1; display: flex; align-items: baseline; gap: 10px; }
  .kop h1 .voor { font-family: var(--boek); font-style: italic; font-size: 18px; color: var(--zacht); }
  .achrona { position: relative; font-family: var(--sierlijk); font-size: 44px; color: var(--bladgoud); letter-spacing: .02em; text-shadow: 0 0 18px rgba(229, 176, 76, .35); }
  .achrona::before, .achrona::after { content: attr(data-tekst); position: absolute; inset: 0; pointer-events: none; opacity: 0; }
  .achrona::before { color: var(--leylijn); animation: desync-a 7s infinite; }
  .achrona::after { color: var(--oracle); animation: desync-b 7s infinite; }
  @keyframes desync-a { 0%, 91%, 100% { opacity: 0; transform: none; clip-path: inset(0 0 0 0); } 92% { opacity: .9; transform: translate(-3px, 1px); clip-path: inset(10% 0 55% 0); } 94% { opacity: .9; transform: translate(4px, -1px); clip-path: inset(60% 0 8% 0); } 96% { opacity: 0; } }
  @keyframes desync-b { 0%, 91%, 100% { opacity: 0; transform: none; clip-path: inset(0 0 0 0); } 92.5% { opacity: .8; transform: translate(3px, 0); clip-path: inset(40% 0 30% 0); } 95% { opacity: .8; transform: translate(-4px, 1px); clip-path: inset(0 0 70% 0); } 96.5% { opacity: 0; } }
  .status { margin: 0; display: inline-flex; align-items: center; gap: 8px; font-family: var(--schrift); font-size: 15px; padding: 5px 14px 5px 10px; border-radius: 999px; background: rgba(255, 255, 255, .05); border: 1px solid var(--gewelf-rand); color: var(--zacht); }
  .status::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--zacht); }
  .status.bezig { color: var(--kaars); border-color: rgba(255, 207, 122, .45); }
  .status.bezig::before { background: var(--kaars); box-shadow: 0 0 10px var(--kaars); animation: vlam 1.3s ease-in-out infinite; }
  .status.klaar { color: var(--ok); border-color: rgba(108, 211, 138, .45); }
  .status.klaar::before { background: var(--ok); }
  .status.onderbroken { color: var(--fout); border-color: rgba(255, 122, 122, .45); }
  .status.onderbroken::before { background: var(--fout); }
  @keyframes vlam { 50% { opacity: .45; transform: scale(.8); } }
  .bediening { display: flex; gap: 10px; align-items: center; }
  .knop { font-family: var(--sierlijk); font-size: 19px; line-height: 1; padding: 8px 20px 9px; border-radius: 999px; border: 2px solid var(--bladgoud); background: linear-gradient(180deg, #f3cd70, #c8901f); color: #2b1a05; cursor: pointer; box-shadow: 0 0 18px rgba(229, 176, 76, .35); }
  .knop:hover { filter: brightness(1.08); }
  .knop:focus-visible { outline: 3px solid var(--leylijn); outline-offset: 3px; }
  .knop:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; filter: none; }
  .knop.stop { background: transparent; color: var(--fout); border-color: rgba(255, 122, 122, .6); box-shadow: none; font-size: 17px; }
  .terminal { margin: 0; max-height: 210px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.45 Consolas, "Cascadia Mono", ui-monospace, monospace; color: #d6d0ec; background: #110e22; border: 1px solid var(--gewelf-rand); border-radius: 10px; padding: 8px 10px; }
  .terminal:empty { display: none; }
  .terminal-bericht { margin: 0 0 8px; font-family: var(--schrift); font-size: 14px; color: var(--zacht); }
  .terminal-bericht:empty { display: none; }
  .terminal-bericht.fout { color: var(--fout); }
  .terminal-bericht.ok { color: var(--ok); }
  .runid { margin-left: auto; font-family: var(--schrift); font-size: 12px; color: var(--zacht); opacity: .7; word-break: break-all; }

  main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 22px; padding: 8px 24px 48px; max-width: 1480px; margin: 0 auto; }
  @media (max-width: 980px) { main { grid-template-columns: minmax(0, 1fr); padding: 8px 12px 40px; } aside { order: -1; position: static !important; max-height: none !important; } .podium { position: relative !important; top: 0 !important; } }
  @media (max-width: 560px) { .zetels { gap: 2px; } .zetel { width: 48px; } .zetel .medaillon { width: 42px; border-width: 2px; } .zetel.koning { width: 62px; } .zetel.koning .medaillon { width: 58px; } .zetel .naam { font-size: 11.5px; } .zetel.actief .naam::after { font-size: 10px; } .podium-voet { grid-template-columns: minmax(0, 1fr); margin-top: 30px; } .kop { padding: 12px 12px 4px; } .achrona { font-size: 34px; } .runid { margin-left: 0; } .spreuk { grid-template-columns: 44px minmax(0, 1fr); gap: 10px; } .spreuk .medaillon { width: 44px; } .perkament { padding: 10px 12px 12px; } .raadpleging { margin-left: 0; } }

  .podium { position: sticky; top: 0; z-index: 5; margin: 0 0 18px; padding: 14px 12px 12px; border-radius: 0 0 26px 26px; background: linear-gradient(180deg, var(--nacht) 0%, #221f3d 100%); border: 1px solid var(--gewelf-rand); border-top: 0; box-shadow: 0 18px 30px -18px rgba(0, 0, 0, .7); }
  .podium::before { content: ""; position: absolute; left: 8%; right: 8%; bottom: 58px; height: 46px; border-radius: 50%; background: radial-gradient(ellipse at center, rgba(229, 176, 76, .16), transparent 70%); pointer-events: none; }
  .leylijn { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: visible; }
  .straal { fill: none; stroke: var(--straal, var(--leylijn)); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 2 10; filter: drop-shadow(0 0 6px var(--straal, var(--leylijn))); animation: stroom 1.2s linear infinite; }
  .straal-kern { fill: none; stroke: var(--leylijn); stroke-width: 1.2; opacity: .55; }
  .straal-kern.nieuw { stroke-dasharray: 1400; stroke-dashoffset: 1400; animation: trek 1s ease-out forwards; }
  @keyframes stroom { to { stroke-dashoffset: -24; } }
  @keyframes trek { to { stroke-dashoffset: 0; } }
  .zetels { position: relative; z-index: 1; display: flex; justify-content: center; align-items: flex-start; gap: clamp(4px, 1.4vw, 18px); }
  .zetel { display: flex; flex-direction: column; align-items: center; width: clamp(66px, 9vw, 104px); transform: translateY(var(--y, 0px)); transition: transform .4s; }
  .zetel .medaillon { width: clamp(54px, 7vw, 82px); }
  .zetel.koning { width: clamp(84px, 12vw, 136px); }
  .zetel.koning .medaillon { width: clamp(72px, 10vw, 116px); }
  .zetel .naam { margin-top: 6px; font-family: var(--sierlijk); font-size: clamp(14px, 1.4vw, 18px); line-height: 1.1; text-align: center; color: var(--kleur); }
  .zetel .pips { margin-top: 3px; display: flex; gap: 3px; min-height: 8px; }
  .zetel .pips i { width: 7px; height: 7px; border-radius: 50%; background: var(--kleur); box-shadow: 0 0 6px var(--kleur); }
  .zetel.stil .medaillon { filter: saturate(.55) brightness(.8); }
  .zetel.actief .medaillon { filter: none; box-shadow: 0 0 0 3px var(--kleur), 0 0 26px 6px color-mix(in srgb, var(--kleur) 70%, transparent); animation: spreekt 1.6s ease-in-out infinite; }
  .zetel.actief .naam::after { content: " spreekt"; font-family: var(--boek); font-style: italic; font-size: 12px; color: var(--kaars); display: block; }
  .zetel.koning.actief .naam::after { content: " beraadt zich"; }
  @keyframes spreekt { 50% { transform: translateY(-4px); } }
  .podium-voet { position: relative; z-index: 1; margin-top: 44px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 18px; align-items: center; }
  .budget { display: flex; align-items: center; gap: 10px; font-family: var(--schrift); font-size: 13px; color: var(--zacht); white-space: nowrap; }
  .kaarsen { display: flex; gap: 4px; }
  .kaarsen i { width: 8px; height: 18px; border-radius: 3px 3px 2px 2px; background: #3d3866; position: relative; }
  .kaarsen i.brandt { background: linear-gradient(#f6e7c4, #d8c18e); }
  .kaarsen i.brandt::before { content: ""; position: absolute; left: 1px; top: -9px; width: 6px; height: 9px; border-radius: 50% 50% 50% 50% / 70% 70% 30% 30%; background: var(--kaars); box-shadow: 0 0 8px var(--kaars); }
  .decreet-lint { margin: 0; font-style: italic; color: var(--licht); font-size: 15px; line-height: 1.4; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .decreet-lint b { font-style: normal; font-family: var(--sierlijk); font-weight: 400; font-size: 17px; }

  .medaillon { aspect-ratio: 1; border-radius: 50%; overflow: hidden; flex: none; background: radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--kleur) 55%, #2b2650) 0%, #1a1733 72%); border: 3px solid var(--kleur); box-shadow: 0 6px 16px rgba(0, 0, 0, .45), inset 0 0 0 2px rgba(0, 0, 0, .25); transition: filter .4s, box-shadow .4s; }
  .medaillon svg { display: block; width: 100%; height: 100%; }

  #debat { min-width: 0; }
  .ronde { display: flex; align-items: center; gap: 14px; margin: 30px 0 12px; font-family: var(--sierlijk); font-weight: 400; font-size: 24px; color: var(--bladgoud); }
  .ronde::before, .ronde::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(229, 176, 76, .55), transparent); }

  .decreet { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; margin: 14px 0 10px; padding: 12px 16px 12px 12px; border-radius: 14px; background: linear-gradient(90deg, rgba(229, 176, 76, .10), rgba(229, 176, 76, .02)); border: 1px solid rgba(229, 176, 76, .30); }
  .decreet .zegel { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 40% 35%, #c2324e, #7e1430); box-shadow: 0 2px 6px rgba(0, 0, 0, .5), inset 0 0 0 3px rgba(255, 255, 255, .08); }
  .decreet .zegel svg { width: 28px; height: 28px; }
  .decreet .aanhef { margin: 0; font-family: var(--sierlijk); font-size: 20px; color: var(--bladgoud); line-height: 1.2; }
  .decreet .aanhef b { font-weight: 400; color: var(--kleur); }
  .decreet .vraag { margin: 6px 0 0; padding-left: 12px; border-left: 2px solid var(--kleur); font-size: 16px; }
  .decreet .waarom { margin: 6px 0 0; font-size: 14.5px; color: var(--zacht); font-style: italic; }
  .decreet .waarom span { font-style: normal; font-family: var(--schrift); font-weight: 700; font-size: 12.5px; color: var(--kaars); margin-right: 4px; }
  .decreet details { margin-top: 6px; font-size: 14px; }
  .decreet summary { cursor: pointer; font-family: var(--schrift); font-size: 13px; color: var(--zacht); width: fit-content; }
  .decreet summary:focus-visible, .spreuk summary:focus-visible { outline: 2px solid var(--leylijn); outline-offset: 2px; border-radius: 4px; }
  .decreet ul { margin: 6px 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
  .decreet li { padding: 2px 10px; border-radius: 999px; background: rgba(95, 225, 217, .08); border: 1px solid rgba(95, 225, 217, .28); font-size: 13.5px; }
  .decreet.stop { background: linear-gradient(90deg, rgba(108, 211, 138, .10), transparent); border-color: rgba(108, 211, 138, .35); }

  .raadpleging { display: flex; gap: 10px; align-items: center; margin: 6px 0 6px 58px; font-family: var(--schrift); font-size: 13.5px; color: var(--zacht); }
  .raadpleging .medaillon { width: 26px; border-width: 2px; }
  .raadpleging b { color: var(--kleur); font-weight: 500; }
  .raadpleging code { color: var(--licht); }
  .vlag { color: var(--fout); font-weight: 700; }

  .spreuk { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 14px; margin: 10px 0 16px; align-items: start; }
  .spreuk .medaillon { width: 64px; }
  .perkament { position: relative; padding: 12px 18px 14px; border-radius: 6px 16px 16px 16px; color: var(--inkt); background: linear-gradient(180deg, var(--perkament), var(--perkament-donker)); box-shadow: 0 10px 24px -12px rgba(0, 0, 0, .7), inset 0 0 40px rgba(140, 100, 40, .18); border-top: 4px solid var(--kleur); }
  .perkament::before { content: ""; position: absolute; left: -9px; top: 18px; border: 9px solid transparent; border-left: 0; border-right-color: var(--perkament); }
  .perkament .hoofd { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin-bottom: 4px; }
  .perkament .naam { font-family: var(--sierlijk); font-size: 22px; line-height: 1.1; color: color-mix(in srgb, var(--kleur) 70%, var(--inkt)); }
  .perkament .nr { font-family: var(--schrift); font-size: 12.5px; color: var(--inkt-zacht); }
  .perkament .tekst { font-size: 16.5px; line-height: 1.65; overflow-wrap: anywhere; max-width: 78ch; }
  .perkament .r { display: block; }
  .perkament .r.tussen { height: .55em; }
  .perkament .r.kop { font-weight: 700; margin-top: .3em; }
  .perkament .r.punt { padding-left: 1.1em; text-indent: -.8em; }
  .perkament .r.punt::before { content: "❧ "; color: var(--kleur); }
  .perkament code { background: rgba(43, 33, 24, .08); color: var(--inkt); }
  .perkament table { border-collapse: collapse; margin: 6px 0; font-size: 14.5px; width: 100%; }
  .perkament th, .perkament td { border-bottom: 1px solid rgba(43, 33, 24, .18); padding: 3px 8px 3px 0; text-align: left; vertical-align: top; }
  .perkament th { font-family: var(--schrift); font-weight: 700; font-size: 13px; color: var(--inkt-zacht); }
  .perkament .onbevestigd { margin-top: 8px; font-family: var(--schrift); font-size: 13px; color: #9a3412; }
  .perkament details { margin-top: 8px; font-family: var(--schrift); font-size: 13px; color: var(--inkt-zacht); }
  .perkament details pre { white-space: pre-wrap; font-family: var(--boek); font-size: 14px; max-height: 280px; overflow: auto; background: rgba(43, 33, 24, .06); padding: 8px; border-radius: 6px; }
  .label { font-family: var(--schrift); font-size: 11.5px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: rgba(43, 33, 24, .10); color: var(--inkt-zacht); }
  .label.goed { background: rgba(21, 128, 61, .14); color: #166534; }

  .id { display: inline-block; text-indent: 0; font-family: var(--schrift); font-weight: 700; font-size: .8em; line-height: 1.35; padding: 0 .45em; border-radius: 999px; white-space: nowrap; vertical-align: .06em; color: #fff; background: color-mix(in srgb, var(--kleur-id) 82%, #2b2118); box-shadow: inset 0 -1px 0 rgba(0, 0, 0, .25); }
  .id.raar { outline: 2px dotted var(--waarschuwing); outline-offset: 1px; }
  aside .id, .decreet .id, .twist .id { color: #fff; }

  .spreuk.proclamatie .perkament { border-top: 0; border: 2px solid var(--bladgoud); background: linear-gradient(180deg, #f6ebcf, #e8d6a6); box-shadow: 0 0 0 4px rgba(229, 176, 76, .18), 0 16px 30px -14px rgba(0, 0, 0, .8); }
  .spreuk.proclamatie .naam::after { content: " spreekt recht"; font-family: var(--boek); font-style: italic; font-size: 15px; color: var(--inkt-zacht); }
  .spreuk.denkt .perkament { background: rgba(239, 227, 198, .12); color: var(--licht); border-top-color: var(--kleur); box-shadow: none; }
  .spreuk.denkt .perkament::before { border-right-color: rgba(239, 227, 198, .12); }
  .spreuk.denkt .naam { color: var(--kleur); }
  .stippen { display: inline-flex; gap: 6px; padding: 6px 0; }
  .stippen i { width: 8px; height: 8px; border-radius: 50%; background: var(--kaars); animation: stip 1.2s infinite ease-in-out; }
  .stippen i:nth-child(2) { animation-delay: .2s; } .stippen i:nth-child(3) { animation-delay: .4s; }
  @keyframes stip { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-4px); } }

  .twist { margin: 12px 0; padding: 14px 16px; border-radius: 14px; background: linear-gradient(135deg, rgba(255, 122, 122, .08), rgba(154, 123, 255, .06)); border: 1px solid rgba(255, 122, 122, .30); }
  .twist h3 { margin: 0 0 8px; font-family: var(--sierlijk); font-weight: 400; font-size: 21px; color: #ffb3a1; }
  .standpunt { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: start; margin: 6px 0; font-size: 15px; }
  .standpunt .medaillon { width: 30px; border-width: 2px; }
  .standpunt b { font-family: var(--sierlijk); font-weight: 400; font-size: 17px; color: var(--kleur); margin-right: 4px; }
  .twist .uitkomst { margin: 10px 0 0; padding-top: 8px; border-top: 1px dashed rgba(255, 255, 255, .15); font-size: 15px; }
  .twist .uitkomst span { font-family: var(--schrift); font-weight: 700; font-size: 13px; color: var(--kaars); margin-right: 4px; }

  .melding { padding: 40px 16px; text-align: center; color: var(--zacht); font-style: italic; font-size: 17px; }

  aside { position: sticky; top: 10px; align-self: start; max-height: calc(100vh - 72px); overflow: auto; scrollbar-width: thin; scrollbar-color: var(--gewelf-rand) transparent; padding-right: 2px; }
  aside section { background: linear-gradient(180deg, var(--gewelf), #1d1a36); border: 1px solid var(--gewelf-rand); border-radius: 16px; padding: 14px 16px; margin-bottom: 14px; box-shadow: 0 10px 22px -16px rgba(0, 0, 0, .8); }
  aside h2 { margin: 0 0 10px; font-family: var(--sierlijk); font-weight: 400; font-size: 22px; color: var(--bladgoud); line-height: 1.1; }
  .lid { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 4px 0; font-size: 15px; }
  .lid .medaillon { width: 34px; border-width: 2px; }
  .lid .wie { color: var(--kleur); font-family: var(--sierlijk); font-size: 17px; }
  .lid.actief .medaillon { box-shadow: 0 0 0 2px var(--kleur), 0 0 12px var(--kleur); }
  .getal { color: var(--zacht); font-family: var(--schrift); font-size: 12.5px; font-variant-numeric: tabular-nums; text-align: right; }
  table.verbruik { width: 100%; border-collapse: collapse; font-family: var(--schrift); font-size: 13.5px; font-variant-numeric: tabular-nums; }
  table.verbruik td { padding: 3px 0; } table.verbruik td:last-child { text-align: right; color: var(--zacht); }
  .tokenbalk { margin-top: 10px; font-family: var(--schrift); font-size: 13px; color: var(--zacht); }
  .tokenbalk .balk { margin-top: 4px; height: 8px; border-radius: 999px; background: #34305a; overflow: hidden; }
  .tokenbalk .balk i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--leylijn), var(--bladgoud)); }
  .tokenbalk.vol .balk i { background: var(--fout); }
  .check { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 6px; font-family: var(--schrift); font-size: 14px; padding: 2px 0; }
  .check::before { font-weight: 700; }
  .check.ok::before { content: "✓"; color: var(--ok); }
  .check.fout::before { content: "✗"; color: var(--fout); }
  .check.let::before { content: "!"; color: var(--waarschuwing); }
  .slot { margin: 10px 0; font-size: 15px; line-height: 1.5; }
  .slot > b { display: block; font-family: var(--sierlijk); font-weight: 400; font-size: 18px; color: var(--kaars); margin-bottom: 1px; }

const zegelKroon = `<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M6 28 L8 11 L15 19 L20 8 L25 19 L32 11 L34 28Z" fill="#f6d27a" stroke="#fff3c4" stroke-width="1.2" stroke-linejoin="round"/><rect x="6" y="27" width="28" height="5" rx="1.5" fill="#f6d27a"/></svg>`;

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const bekend = rol => Object.prototype.hasOwnProperty.call(NAMEN, rol);
const kleur = rol => `var(--${bekend(rol) ? rol : "koning"})`;
const naam = rol => NAMEN[rol] || rol;
const medaillon = rol => `<div class="medaillon" style="--kleur:${kleur(rol)}">${(AVATAR[rol] || AVATAR.mens)()}</div>`;

function inline(tekst) {
  return esc(tekst)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s).,;:!?]|$)/g, "$1<em>$2</em>")
    .replace(ID_RE, (m, p, streep, n) => {
      const raar = streep !== "-";
      return `<span class="id${raar ? " raar" : ""}" style="--kleur-id:${kleur(PREFIX[p])}" title="${raar ? "Geen gewoon koppelteken: dit ID faalt op het schema" : naam(PREFIX[p])}">${p}-${n}</span>`;
    });
}

function tabel(regels) {
  const rijen = regels.filter(r => !/^\s*\|?\s*:?-{2,}/.test(r)).map(r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim()));
  if (!rijen.length) return "";
  const [kop, ...rest] = rijen;
  return `<table><thead><tr>${kop.map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${rest.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}

function opmaak(tekst) {
  const uit = [];
  let blok = [];
  const spoel = () => { if (blok.length) { uit.push(tabel(blok)); blok = []; } };
  for (const r of String(tekst ?? "").split("\n")) {
    if (/^\s*\|.*\|\s*$/.test(r)) { blok.push(r); continue; }
    spoel();
    if (!r.trim()) uit.push('<span class="r tussen"></span>');
    else if (/^\s*#{1,4}\s+/.test(r)) uit.push(`<span class="r kop">${inline(r.replace(/^\s*#{1,4}\s+/, ""))}</span>`);
    else if (/^\s*([-*•]|\d+[.)])\s+/.test(r)) uit.push(`<span class="r punt">${inline(r.replace(/^\s*([-*•]|\d+[.)])\s+/, ""))}</span>`);
    else uit.push(`<span class="r">${inline(r)}</span>`);
  }
  spoel();
  return uit.join("");
}

const kort = (tekst, n) => { const t = String(tekst ?? "").replace(/\s+/g, " ").trim(); return t.length > n ? t.slice(0, n - 1) + "…" : t; };

function ids(tekst) {
  return [...String(tekst ?? "").matchAll(ID_RE)].map(m => ({ id: `${m[1]}-${m[3]}`, raar: m[2] !== "-" }));
}

function renderPodium(trace, telling, raadslidBeurten, laatsteAan, laatsteVraag, laatsteReden) {
  const leden = trace.raadsleden || [];
  const links = leden.slice(0, Math.ceil(leden.length / 2)), rechts = leden.slice(Math.ceil(leden.length / 2));
  const rij = [...links, "koning", ...rechts];
  const midden = links.length;
  const actief = trace.status === "bezig" ? trace.aan_het_woord : null;
  document.getElementById("zetels").innerHTML = rij.map((rol, i) => {
    const d = Math.abs(i - midden);
    const y = rol === "koning" ? -4 : d * d * 3 + d * 4;
    const n = telling[rol]?.berichten || 0;
    const pips = rol === "koning" ? "" : Array.from({ length: n }, () => "<i></i>").join("");
    const klassen = ["zetel", rol === "koning" ? "koning" : "", actief === rol ? "actief" : actief ? "stil" : ""].join(" ");
    return `<div class="${klassen}" data-rol="${esc(rol)}" style="--kleur:${kleur(rol)};--y:${y}px">${medaillon(rol)}<div class="naam">${esc(naam(rol))}</div><div class="pips" title="${n} beurt${n === 1 ? "" : "en"}">${pips}</div></div>`;
  }).join("");
  document.getElementById("budget").innerHTML = `<span class="kaarsen" aria-hidden="true">${Array.from({ length: BEURTENBUDGET }, (_, i) => `<i class="${i < raadslidBeurten ? "brandt" : ""}"></i>`).join("")}</span><span>${raadslidBeurten} van ${BEURTENBUDGET} beurten</span>`;
  const lint = document.getElementById("lint");
  if (trace.status === "bezig" && laatsteAan) lint.innerHTML = `<b style="color:var(--koning)">De Koning</b> tot <b style="color:${kleur(laatsteAan)}">de ${esc(naam(laatsteAan))}</b>: “${esc(kort(laatsteVraag, 220))}”`;
  else if (trace.status === "bezig") lint.innerHTML = `<b style="color:var(--koning)">De Koning</b> overweegt wie hij het woord geeft…`;
  else if (laatsteReden) lint.innerHTML = `<b style="color:var(--ok)">Het debat is gesloten.</b> ${esc(kort(laatsteReden, 220))}`;
  else lint.textContent = "";
}

function tekenLeylijn(aan, nieuw) {
  const lijn = document.getElementById("leylijn");
  const podium = document.querySelector(".podium");
  const k = podium.querySelector('.zetel[data-rol="koning"] .medaillon');
  const d = aan ? podium.querySelector(`.zetel[data-rol="${CSS.escape(aan)}"] .medaillon`) : null;
  if (!k || !d) { lijn.innerHTML = ""; return; }
  const P = podium.getBoundingClientRect(), a = k.getBoundingClientRect(), b = d.getBoundingClientRect();
  const x1 = a.left + a.width / 2 - P.left, y1 = a.top + a.height / 2 - P.top;
  const x2 = b.left + b.width / 2 - P.left, y2 = b.top + b.height / 2 - P.top;
  const cx = (x1 + x2) / 2, cy = Math.max(6, Math.min(y1, y2) - 70);
  lijn.setAttribute("viewBox", `0 0 ${P.width} ${P.height}`);
  const pad = `M${x1.toFixed(1)},${y1.toFixed(1)} Q${cx.toFixed(1)},${cy.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}`;
  lijn.innerHTML = `<path class="straal-kern${nieuw ? " nieuw" : ""}" d="${pad}"/><path class="straal" style="--straal:${kleur(aan)}" d="${pad}"/>`;
}

function render(trace, verdict) {
  const status = document.getElementById("status");
  const bezig = trace.status === "bezig";
  traceBezig = bezig;
  status.className = "status " + (bezig ? "bezig" : "klaar");
  const spreker = trace.aan_het_woord;
  status.textContent = bezig
    ? (spreker === "koning" ? "De Koning beraadt zich" : spreker ? `De ${naam(spreker)} spreekt` : "De Raad komt samen")
    : "Het Verdict is geveld";
  document.getElementById("runid").textContent = trace.run_id || "";

  const beurten = trace.beurten || [];
  let html = "", ronde = null;
  const telling = {}, padfouten = [], koningTools = [], vreemdeIds = [], zonderRoutering = [];
  let toegewezen = null, raadslidBeurten = 0, laatsteAan = null, laatsteVraag = "", laatsteReden = "", laatsteNr = null;
  for (let i = 0; i < beurten.length; i++) {
    const b = beurten[i];
    if (b.ronde !== ronde) {
      ronde = b.ronde;
      const titel = ronde === 0 ? "Voorbereiding" : b.spreker === "koning" && b.soort === "bericht" ? "Het Verdict" : "Ronde " + ronde;
      html += `<h2 class="ronde">${titel}</h2>`;
    }
    const t = telling[b.spreker] ??= { berichten: 0, tools: 0, ids: new Set() };
    const stijl = `style="--kleur:${kleur(b.spreker)}"`;
    if (b.soort === "routering") {
      toegewezen = b.aan;
      laatsteAan = b.aan; laatsteVraag = b.vraag || ""; laatsteReden = b.reden || ""; laatsteNr = b.nr;
      const open = (b.open_vragen || []).length ? `<details><summary>Open vragen van de Koning (${b.open_vragen.length})</summary><ul>${b.open_vragen.map(v => `<li>${inline(v)}</li>`).join("")}</ul></details>` : "";
      const wie = b.spreker === "koning" ? "De Koning" : esc(naam(b.spreker));
      html += b.aan
        ? `<article class="decreet" style="--kleur:${kleur(b.aan)}"><div class="zegel">${zegelKroon}</div><div><p class="aanhef">${wie} roept <b>de ${esc(naam(b.aan))}</b></p><p class="vraag">${inline(b.vraag)}</p><p class="waarom"><span>Waarom</span>${inline(b.reden)}</p>${open}</div></article>`
        : `<article class="decreet stop" style="--kleur:var(--ok)"><div class="zegel">${zegelKroon}</div><div><p class="aanhef">${wie} sluit het debat</p><p class="waarom"><span>Waarom</span>${inline(b.reden)}</p>${open}</div></article>`;
      continue;
    }
    if (b.soort === "bericht" && bekend(b.spreker) && !["koning", "mens"].includes(b.spreker)) {
      raadslidBeurten++;
      if (toegewezen !== b.spreker) zonderRoutering.push(b.nr);
      toegewezen = null;
    }
    if (b.soort === "bericht") {
      t.berichten++;
      for (const x of ids(b.tekst)) { t.ids.add(x.id); if (x.raar) vreemdeIds.push(x.id); }
      const proclamatie = b.spreker === "koning";
      const labels = [];
      if ((b.bewijs || []).length) labels.push(`<span class="label goed" title="${esc(b.bewijs.join(", "))}">${b.bewijs.length} ID's bevestigd</span>`);
      if (b.ruwe_tekst) labels.push(`<span class="label">ingekort</span>`);
      const onb = (b.onbevestigd || []).length ? `<div class="onbevestigd">Niet teruggevonden in de eigen Kennisbron: ${b.onbevestigd.map(inline).join(" ")}</div>` : "";
      const ruw = b.ruwe_tekst ? `<details><summary>Toon het volledige, oorspronkelijke antwoord</summary><pre>${esc(b.ruwe_tekst)}</pre></details>` : "";
      html += `<article class="spreuk${proclamatie ? " proclamatie" : ""}" ${stijl}>${medaillon(b.spreker)}<div class="perkament"><div class="hoofd"><span class="naam">${proclamatie ? "De Koning" : "De " + esc(naam(b.spreker))}</span><span class="nr">beurt ${b.nr}${b.aan ? " · tot " + esc(naam(b.aan)) : ""}</span>${labels.join("")}</div><div class="tekst">${opmaak(b.tekst)}</div>${onb}${ruw}</div></article>`;
      continue;
    }
    const groep = [b];
    while (i + 1 < beurten.length && beurten[i + 1].spreker === b.spreker && beurten[i + 1].soort === b.soort && beurten[i + 1].ronde === b.ronde) groep.push(beurten[++i]);
    const delen = groep.map(g => {
      t.tools++;
      let vlag = "";
      if (g.soort === "toolcall") {
        if (g.spreker === "koning") { koningTools.push(g.nr); vlag = ` <span class="vlag">Koning leest een Kennisbron</span>`; }
        else if (g.pad && !g.pad.includes(`/${g.spreker}/`)) { padfouten.push(g.nr); vlag = ` <span class="vlag">pad van een andere Rol</span>`; }
        return `<code>${esc(g.tool)}(${esc(Object.entries(g.argumenten || {}).map(([k, v]) => `${k}=${JSON.stringify(v)}`).join(", "))})</code>${vlag}`;
      }
      if (g.soort === "bestand" && g.bestand && !g.bestand.startsWith(g.spreker + "/")) { padfouten.push(g.nr); vlag = ` <span class="vlag">bestand van een andere Rol</span>`; }
      return `<code>${esc(String(g.bestand || "").split("/").pop())}</code>${vlag}`;
    });
    const werkwoord = b.soort === "toolcall" ? "raadpleegt zijn Kennisbron:" : "ontvangt zijn Kennisbron:";
    html += `<div class="raadpleging" ${stijl}>${medaillon(b.spreker)}<span><b>${esc(naam(b.spreker))}</b> ${werkwoord} ${delen.join(" ")}</span></div>`;
  }
  if (bezig && spreker) {
    html += `<article class="spreuk denkt" style="--kleur:${kleur(spreker)}">${medaillon(spreker)}<div class="perkament"><div class="hoofd"><span class="naam">${spreker === "koning" ? "De Koning" : "De " + esc(naam(spreker))}</span><span class="nr">${spreker === "koning" ? "beraadt zich" : "zoekt in zijn Kennisbron"}</span></div><div class="stippen" aria-label="denkt na"><i></i><i></i><i></i></div></div></article>`;
  }
  for (const g of trace.geschillen || []) {
    html += `<article class="twist"><h3>Twistpunt: ${esc(g.onderwerp)}</h3>${Object.entries(g.standpunten || {}).map(([r, s]) => `<div class="standpunt" style="--kleur:${kleur(r)}">${medaillon(r)}<div><b>${esc(naam(r))}</b>${inline(s)}</div></div>`).join("")}<p class="uitkomst"><span>Uitkomst</span>${g.uitkomst ? inline(g.uitkomst) : '<span class="leeg">niet beslecht</span>'} ${(g.bewijs || []).map(inline).join(" ")}</p></article>`;
  }
  const debat = document.getElementById("debat");
  const onderaan = window.innerHeight + window.scrollY >= document.body.scrollHeight - 80;
  const open = new Set([...debat.querySelectorAll("details[open]")].map(d => d.closest("article")?.querySelector(".nr, .aanhef")?.textContent));
  debat.innerHTML = html || '<p class="melding">De Raad is bijeen; de eerste beurt komt eraan.</p>';
  debat.querySelectorAll("details").forEach(d => { if (open.has(d.closest("article")?.querySelector(".nr, .aanhef")?.textContent)) d.open = true; });
  if (bezig && onderaan) window.scrollTo(0, document.body.scrollHeight);

  renderPodium(trace, telling, raadslidBeurten, laatsteAan, laatsteVraag, laatsteReden);
  const straal = bezig && spreker && spreker !== "koning" && laatsteAan === spreker ? spreker : null;
  const nieuw = straal && laatsteNr !== laatsteRoutering;
  laatsteRoutering = laatsteNr;
  huidigeStraal = straal;
  requestAnimationFrame(() => tekenLeylijn(straal, nieuw));

  document.getElementById("leden").innerHTML = [...(trace.raadsleden || []), "koning"].map(r => {
    const t = telling[r] || { berichten: 0, tools: 0, ids: new Set() };
    return `<div class="lid${bezig && spreker === r ? " actief" : ""}" style="--kleur:${kleur(r)}">${medaillon(r)}<span class="wie">${esc(naam(r))}</span><span class="getal">${t.berichten} ber · ${t.tools} bron · ${t.ids.size} ID's</span></div>`;
  }).join("");

  const zonderBron = (trace.raadsleden || []).filter(r => !(telling[r]?.tools));
  const checks = [
    [padfouten.length ? "fout" : "ok", padfouten.length ? `Kennisbron van een andere Rol gelezen (beurt ${padfouten.join(", ")})` : "Elk Raadslid las alleen de eigen Kennisbron"],
    [koningTools.length ? "fout" : "ok", koningTools.length ? `Koning las een Kennisbron (beurt ${koningTools.join(", ")})` : "Koning las geen Kennisbron"],
    [zonderBron.length ? "let" : "ok", zonderBron.length ? `Zonder bron: ${zonderBron.map(naam).join(", ")}` : "Elk Raadslid raadpleegde een bron"],
    [vreemdeIds.length ? "let" : "ok", vreemdeIds.length ? `ID's met een vreemd koppelteken: ${[...new Set(vreemdeIds)].join(", ")}` : "ID's in de juiste vorm"],
    [(trace.raadsleden || []).length >= 3 ? "ok" : "let", `${(trace.raadsleden || []).length} Rollen (minimum 3)`],
    [raadslidBeurten > BEURTENBUDGET ? "fout" : "ok", `${raadslidBeurten} van ${BEURTENBUDGET} Raadslid-beurten (Beurtenbudget)`],
    [zonderRoutering.length ? "fout" : "ok", zonderRoutering.length ? `Raadslid-beurt zonder Routering ervoor (beurt ${zonderRoutering.join(", ")})` : "Elke Raadslid-beurt had een Routering"],
  ];
  document.getElementById("checks").innerHTML = checks.map(([k, t]) => `<div class="check ${k}">${esc(t)}</div>`).join("");

  const v = trace.verbruik || {};
  const tok = trace.tokens;
  const balk = tok && tok.budget ? (() => {
    const deel = Math.min(100, Math.round(100 * tok.gebruikt / tok.budget));
    return `<div class="tokenbalk${tok.gebruikt > tok.budget ? " vol" : ""}">Tokenbudget: ${(tok.gebruikt || 0).toLocaleString("nl-BE")} van ${tok.budget.toLocaleString("nl-BE")}<div class="balk"><i style="width:${deel}%"></i></div></div>`;
  })() : "";
  document.getElementById("verbruik").innerHTML = Object.keys(v).length
    ? `<table class="verbruik">${Object.entries(v).map(([m, x]) => `<tr><td>${esc(m)} · ${x.beurten ?? x.calls} beurten</td><td>${(x.invoer || 0).toLocaleString("nl-BE")} in · ${(x.uitvoer || 0).toLocaleString("nl-BE")} uit</td></tr>`).join("")}</table>${balk}`
    : '<span class="leeg">nog geen calls</span>';

  const vd = document.getElementById("verdict");
  if (!verdict || verdict.run_id !== trace.run_id) {
    vd.innerHTML = `<span class="leeg">${verdict ? "verdict.json hoort bij een andere run" : bezig ? "komt na het debat, van de Koning" : "geen verdict.json"}</span>`;
  } else {
    const zeker = s => typeof s?.zekerheid === "number" ? `<div class="zeker">zekerheid <span class="balk"><i style="width:${Math.round(s.zekerheid * 100)}%"></i></span> ${Math.round(s.zekerheid * 100)}%</div>` : "";
    const slot = (titel, s) => `<div class="slot"><b>${titel}</b>${s?.bewering ? inline(s.bewering) + " " + (s.bewijs || []).map(inline).join(" ") + zeker(s) : '<span class="leeg">onbekend (null)</span>'}</div>`;
    const o = verdict.oorzaak || {};
    const vs = verdict.voorspelling;
    vd.innerHTML = `<div class="slot"><b>Samenvatting</b>${verdict.samenvatting === "TODO" ? '<span class="leeg">TODO</span>' : inline(verdict.samenvatting)}</div>`
      + slot("Ingreep", o.ingreep) + slot("Mechanisme", o.mechanisme) + slot("Verloop", o.verloop)
      + `<div class="slot"><b>Herstelplan</b><ol>${(verdict.acties || []).map(a => `<li>${inline(a.actie)}</li>`).join("")}</ol></div>`
      + `<div class="slot"><b>Risico's</b><ol>${(verdict.risicos || []).map(r => `<li>${inline(r.risico)}${r.mitigatie ? `<small>${inline(r.mitigatie)}</small>` : ""}</li>`).join("")}</ol></div>`
      + (vs ? `<div class="slot"><b>Voorspelling: dag ${esc(vs.dag)}</b>${inline(vs.bewering)} ${(vs.bewijs || []).map(inline).join(" ")}</div>` : "");
  }
}

let melding = null;

function toonBediening(s) {
  const bediening = document.getElementById("bediening"), sectie = document.getElementById("terminalsectie");
  if (!s || typeof s.kan_starten !== "boolean") { bediening.hidden = true; sectie.hidden = true; return; }
  bediening.hidden = false;
  const start = document.getElementById("startknop"), stop = document.getElementById("stopknop");
  start.hidden = s.loopt; stop.hidden = !s.loopt;
  start.disabled = !s.kan_starten; start.title = s.kan_starten ? "Start een nieuwe run van de Council" : s.reden;
  const pre = document.getElementById("terminal");
  const onderaan = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 20;
  if (pre.textContent !== (s.log || "")) { pre.textContent = s.log || ""; if (onderaan) pre.scrollTop = pre.scrollHeight; }
  const bericht = document.getElementById("terminalbericht");
  let tekst = "", soort = "";
  if (melding) { tekst = melding.tekst; soort = melding.soort; }
  else if (s.loopt) tekst = `De Council draait sinds ${String(s.gestart || "").slice(11, 16)}.`;
  else if (s.handmatig) { tekst = "De run is gestopt met de knop. trace.json is onvolledig: commit deze run niet."; soort = "fout"; }
  else if (s.exitcode === 0) { tekst = "De laatste run is klaar. Controleer met uv run validate voor je commit."; soort = "ok"; }
  else if (s.exitcode !== null && s.exitcode !== undefined) { tekst = `De laatste run stopte met code ${s.exitcode}. De reden staat onderaan de terminal.`; soort = "fout"; }
  if (s.backup && (s.loopt || melding)) tekst += ` De vorige run staat in ${s.backup}.`;
  bericht.textContent = tekst.trim(); bericht.className = "terminal-bericht " + soort;
  sectie.hidden = !(s.log || s.loopt || tekst);
  const status = document.getElementById("status");
  if (traceBezig && !s.loopt && (s.handmatig || (s.exitcode !== null && s.exitcode !== undefined && s.exitcode !== 0))) {
    status.className = "status onderbroken"; status.textContent = "De run is onderbroken";
  }
}

async function stuurCouncil(actie) {
  try {
    const r = await fetch(`/council/${actie}`, { method: "POST", headers: { "X-Council": "1" } });
    return await r.json();
  } catch { return { ok: false, bericht: "De viewer-server antwoordt niet. Draait uv run viewer nog?" }; }
}

async function haalStatus() {
  try { const r = await fetch("/council/status", { cache: "no-store" }); return r.ok ? await r.json() : null; } catch { return null; }
}

document.getElementById("startknop").addEventListener("click", async () => {
  if (vorige && !confirm("Een nieuwe run overschrijft trace.json en verdict.json. De huidige run wordt eerst bewaard in de map backups. Nu starten?")) return;
  document.getElementById("startknop").disabled = true;
  const d = await stuurCouncil("start");
  melding = { tekst: d.bericht || "", soort: d.ok ? "ok" : "fout" };
  setTimeout(() => { melding = null; }, 6000);
  if (d.ok) vorige = "";
  toonBediening(d.kan_starten === undefined ? await haalStatus() : d);
});

document.getElementById("stopknop").addEventListener("click", async () => {
  if (!confirm("De run stoppen? trace.json blijft dan onvolledig en er komt geen verdict.json.")) return;
  document.getElementById("stopknop").disabled = true;
  const d = await stuurCouncil("stop");
  document.getElementById("stopknop").disabled = false;
  melding = { tekst: d.bericht || "", soort: d.ok ? "" : "fout" };
  setTimeout(() => { melding = null; }, 6000);
  toonBediening(d.kan_starten === undefined ? await haalStatus() : d);
});

async function haal(pad) {
  try { const r = await fetch(pad, { cache: "no-store" }); return r.ok ? await r.text() : null; } catch { return null; }
}

async function lus() {
  const [t, v, s] = await Promise.all([haal("trace.json"), haal("verdict.json"), haalStatus()]);
  toonBediening(s);
  if (t && t + (v || "") !== vorige) {
    vorige = t + (v || "");
    try { render(JSON.parse(t), v ? JSON.parse(v) : null); } catch (e) { if (!(e instanceof SyntaxError)) console.error(e); }
  }
  setTimeout(lus, 1500);
}

document.getElementById("wapen").innerHTML = zegelKroon;
renderPodium({ raadsleden: [], status: "" }, {}, 0, null, "", "");
window.addEventListener("resize", () => tekenLeylijn(huidigeStraal, false));
lus();
</script>
</body>
